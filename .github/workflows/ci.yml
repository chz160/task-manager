name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install build libraries (fontconfig, for Slint text) and a D-Bus daemon (for the Services tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev dbus
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: dbus-run-session -- cargo test --release

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Xvfb and runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 fonts-dejavu-core libfontconfig1-dev
      - run: cargo build --release -p tm-gui
      - name: CPU budget (<2% of a core at 1 s refresh, ~1000 processes)
        run: scripts/perf-check.sh target/release/tm-gui
      - uses: actions/upload-artifact@v4
        with:
          name: tm-gui-linux-x86_64
          path: target/release/tm-gui
